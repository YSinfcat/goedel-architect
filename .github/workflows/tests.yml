name: tests

# Pure-Python regression suite: no Lean toolchain, no network, no API keys.
# The Lean-dependent paths (blueprint compilation, node proving) are not
# covered here - see README's known limitations.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile everything
        run: python -m compileall -q src eval tests
      - name: Run regression tests
        env:
          GOEDEL_LEAN_TOOLCHAIN: ci-no-lean
        run: python -m unittest discover -s tests -v
